name: Game checks
on: [push, pull_request]
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run deploy:check
  browser:
    # Drives the built site and Worker in local workerd with a headless browser: load, play, results, save, retry.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
  deploy:
    # Deploys main to Cloudflare after both check jobs pass. Needs the repository secrets
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the job reports and skips.
    runs-on: ubuntu-latest
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: production-deploy
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
      - run: npm ci
      - name: Check deploy credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply database migrations
        if: steps.credentials.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        if: steps.credentials.outputs.configured == 'true'
        run: npx wrangler deploy
